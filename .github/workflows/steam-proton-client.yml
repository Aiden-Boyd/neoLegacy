name: Steam Proton Client

on:
  push:
    branches:
      - steam-proton-base
      - fix/base-stability
      - qa/sponge-bounded-workspace
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-proton-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-client:
    name: Windows64 client baseline
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ""

    steps:
      - name: Checkout source and embedded libraries
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Verify embedded dependencies
        shell: pwsh
        run: |
          $required = @(
            "Minecraft.Client/Windows64/4JLibs/CMakeLists.txt",
            "Minecraft.Client/Windows64/Iggy/lib/iggy_w64.lib",
            "Minecraft.Client/Windows64/Iggy/lib/redist64"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required dependency: $path" }
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Start detailed build transcript
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          Get-ComputerInfo -Property WindowsProductName,WindowsVersion,OsArchitecture | Out-File logs/host.txt
          Get-PSDrive -PSProvider FileSystem | Out-File logs/disk-space.txt

      - name: Setup .NET for existing CMake configuration
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Record toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          cmake --version | Tee-Object logs/cmake-version.txt
          ninja --version | Tee-Object logs/ninja-version.txt
          dotnet --info | Out-File logs/dotnet-info.txt
          git rev-parse HEAD | Out-File logs/commit.txt

      - name: Run base stability regression checks
        shell: pwsh
        run: |
          python tests/base_stability_regression.py 2>&1 | Tee-Object logs/base-stability-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run absorption workspace differential checks
        shell: pwsh
        run: |
          python tests/sponge_workspace_regression.py 2>&1 | Tee-Object logs/sponge-workspace-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify runtime diagnostics and crash capture
        shell: pwsh
        run: |
          cl /nologo /EHsc /std:c++17 /Zi tests/client_diagnostics_smoke.cpp /Fe:logs/client_diagnostics_smoke.exe /link user32.lib 2>&1 | Tee-Object logs/diagnostics-compile.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./logs/client_diagnostics_smoke.exe 2>&1 | Tee-Object logs/diagnostics-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows64
        shell: pwsh
        run: |
          cmake --preset windows64 --log-level=VERBOSE --debug-output -DCMAKE_EXPORT_COMPILE_COMMANDS=ON 2>&1 | Tee-Object logs/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build game client
        shell: pwsh
        run: |
          cmake --build --preset windows64-release --target Minecraft.Client --parallel 2 --verbose 2>&1 | Tee-Object logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage playable runtime
        shell: pwsh
        run: |
          $source = "build/windows64/Minecraft.Client/Release"
          $stage = "staging/neoLegacy"
          if (-not (Test-Path "$source/Minecraft.Client.exe")) {
            throw "Client executable was not produced."
          }
          New-Item -ItemType Directory -Force $stage | Out-Null
          Get-ChildItem $source -File | Where-Object {
            $_.Extension -in ".exe", ".dll"
          } | Copy-Item -Destination $stage
          foreach ($folder in @("Common", "music", "Windows64", "Windows64Media")) {
            if (Test-Path "$source/$folder") {
              Copy-Item "$source/$folder" "$stage/$folder" -Recurse
            }
          }
          foreach ($path in @("Common/Media", "Common/res", "iggy_w64.dll")) {
            if (-not (Test-Path "$stage/$path")) {
              throw "Runtime package is incomplete: $path"
            }
          }
          New-Item -ItemType Directory -Force "$stage/Windows64/GameHDD" | Out-Null
          Get-ChildItem $stage -File | Where-Object { $_.Extension -in ".exe", ".dll" } | ForEach-Object {
            "Dependencies: $($_.Name)" | Tee-Object logs/runtime-dependencies.log -Append
            dumpbin /dependents $_.FullName 2>&1 | Tee-Object logs/runtime-dependencies.log -Append
            if ($LASTEXITCODE -ne 0) { throw "Dependency inspection failed: $($_.Name)" }
          }
          Copy-Item STEAM_PROTON.md "$stage/STEAM_PROTON.md"
          Copy-Item BASE_STABILITY_TESTS.md "$stage/BASE_STABILITY_TESTS.md"
          Copy-Item CRASH_DIAGNOSTICS.md "$stage/CRASH_DIAGNOSTICS.md"
          @(
            "Commit: ${{ github.sha }}",
            "Configuration: Windows64 Release",
            "Runtime: Windows executable; test through Steam/Proton on Bazzite.",
            "Compilation does not establish controller compatibility or CU59 parity."
          ) | Set-Content "$stage/BUILD_INFO.txt"
          Get-ChildItem $stage -Recurse -File |
            ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Resolve-Path $stage).Path, $_.Path)
              "$($_.Hash)  $relative"
            } | Set-Content staging/SHA256SUMS.txt

      - name: Upload client test artifact
        uses: actions/upload-artifact@v6
        with:
          name: neoLegacy-steam-proton-windows64
          path: staging/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: steam-proton-build-logs
          path: |
            logs/
            build/windows64/CMakeCache.txt
            build/windows64/CMakeFiles/CMakeConfigureLog.yaml
            build/windows64/compile_commands.json
            build/windows64/.ninja_log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload matching debugging symbols
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: steam-proton-debug-symbols
          path: build/windows64/**/*.pdb
          if-no-files-found: ignore
          retention-days: 14

