name: Steam Proton Client

on:
  push:
    branches:
      - steam-proton-base
      - fix/base-stability
      - feature/end-palette
      - fix/flight-head-inventory
      - fix/end-portal-projection
      - feature/chorus-end-rods
      - feature/outer-end-islands
      - feature/end-gateways
      - feature/end-cities-shulkers
      - feature/shulker-boxes
      - feature/shulker-box-polish
      - feature/mending
      - feature/frost-walker
      - feature/nether-beetroot
      - feature/overworld-integration
      - feature/end-respawn
      - fix/creative-elytra-equip
      - feature/rockets-color-observers
      - feature/shulker-lid-collision
      - feature/villager-food
      - feature/map-texture-compat
      - feature/end-reliability
      - feature/tutorial-world-compat
      - feature/mini-games
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-proton-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-client:
    name: Windows64 Tumble and join codes
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      VCPKG_ROOT: ""

    steps:
      - name: Checkout source and embedded libraries
        uses: actions/checkout@v6
        with:
          submodules: false
          persist-credentials: false

      - name: Verify embedded dependencies
        shell: pwsh
        run: |
          $required = @(
            "Minecraft.Client/Windows64/4JLibs/CMakeLists.txt",
            "Minecraft.Client/Windows64/Iggy/lib/iggy_w64.lib",
            "Minecraft.Client/Windows64/Iggy/lib/redist64"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required dependency: $path" }
          }

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup .NET for existing CMake configuration
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Record toolchain
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs | Out-Null
          cmake --version | Tee-Object logs/cmake-version.txt
          ninja --version | Tee-Object logs/ninja-version.txt
          dotnet --info | Out-File logs/dotnet-info.txt
          git rev-parse HEAD | Out-File logs/commit.txt

      - name: Run base stability regression checks
        shell: pwsh
        run: |
          python tests/base_stability_regression.py 2>&1 | Tee-Object logs/base-stability-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run world launch texture-pack regression
        shell: pwsh
        run: |
          python tests/world_launch_regression.py 2>&1 | Tee-Object logs/world-launch-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run skin texture identity and layout regression
        shell: pwsh
        run: |
          python tests/skin_layout_regression.py 2>&1 | Tee-Object logs/skin-layout-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run End palette regression checks
        shell: pwsh
        run: |
          python tests/end_palette_regression.py 2>&1 | Tee-Object logs/end-palette-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run flight, inventory and furnace regressions
        shell: pwsh
        run: |
          python tests/flight_inventory_regression.py 2>&1 | Tee-Object logs/flight-inventory-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run portal projection regression
        shell: pwsh
        run: |
          python tests/portal_projection_regression.py 2>&1 | Tee-Object logs/portal-projection-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run chorus and rod regressions
        shell: pwsh
        run: |
          python tests/chorus_regression.py 2>&1 | Tee-Object logs/chorus-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run outer End terrain, population and bounds regressions
        shell: pwsh
        run: |
          python tests/outer_end_regression.py 2>&1 | Tee-Object logs/outer-end-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run gateway transport, persistence and renderer regressions
        shell: pwsh
        run: |
          python tests/gateway_regression.py 2>&1 | Tee-Object logs/gateway-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run city geometry, persistence and shulker regressions
        shell: pwsh
        run: |
          python tests/end_city_templates_regression.py 2>&1 | Tee-Object logs/end-city-assets-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/generate_end_city_header.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/end_city_regression.py 2>&1 | Tee-Object logs/end-city-gameplay-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run shulker box lifecycle regressions
        shell: pwsh
        run: |
          python tests/shulker_box_regression.py 2>&1 | Tee-Object logs/shulker-boxes.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run box recolor and dispenser regressions
        shell: pwsh
        run: |
          python tests/shulker_box_polish_regression.py 2>&1 | Tee-Object logs/shulker-box-polish.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Mending regressions
        shell: pwsh
        run: |
          python tests/mending_regression.py 2>&1 | Tee-Object logs/mending.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Frost Walker regressions
        shell: pwsh
        run: |
          python tests/frost_walker_regression.py 2>&1 | Tee-Object logs/frost-walker.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Nether, bone and beetroot regressions
        shell: pwsh
        run: |
          python tests/content_update_regression.py 2>&1 | Tee-Object logs/content-update.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Overworld integration regressions
        shell: pwsh
        run: |
          python tools/generate_fossil_header.py --check 2>&1 | Tee-Object logs/fossil-templates.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/overworld_regression.py 2>&1 | Tee-Object logs/overworld.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run End respawn regressions
        shell: pwsh
        run: |
          python tests/end_fight_regression.py 2>&1 | Tee-Object logs/end-fight.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/end_crystal_integration.py 2>&1 | Tee-Object logs/end-crystal-integration.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Creative texture and Elytra equip regressions
        shell: pwsh
        run: |
          python tests/tile_texture_regression.py 2>&1 | Tee-Object logs/tile-textures.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/equipment_inventory_regression.py 2>&1 | Tee-Object logs/elytra-equip.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run rocket, color and observer regressions
        shell: pwsh
        run: |
          python tests/color_observer_regression.py 2>&1 | Tee-Object logs/color-observer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/rocket_boost_regression.py 2>&1 | Tee-Object logs/rocket-boost.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/color_recipe_regression.py 2>&1 | Tee-Object logs/color-recipes.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/color_assets_regression.py 2>&1 | Tee-Object logs/color-assets.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run villager food regressions
        shell: pwsh
        run: |
          python tests/villager_food_regression.py 2>&1 | Tee-Object logs/villager-food.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run map and texture compatibility regressions
        shell: pwsh
        run: |
          python tests/map_texture_regression.py 2>&1 | Tee-Object logs/map-texture.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run tutorial compatibility regressions
        shell: pwsh
        run: |
          python tests/tutorial_compat_regression.py 2>&1 | Tee-Object logs/tutorial-compat.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run imported tutorial lesson regressions
        shell: pwsh
        run: |
          python tests/tutorial_lessons_regression.py 2>&1 | Tee-Object logs/tutorial-lessons.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run mini-game and modern import regressions
        shell: pwsh
        run: |
          python tests/mini_games_regression.py 2>&1 | Tee-Object logs/mini-games.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/import_nbt_regression.py 2>&1 | Tee-Object logs/import-nbt.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure Windows64
        shell: pwsh
        run: |
          cmake --preset windows64 2>&1 | Tee-Object logs/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build game client
        shell: pwsh
        run: |
          cmake --build --preset windows64-release --target Minecraft.Client --parallel 2 2>&1 | Tee-Object logs/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage playable runtime
        shell: pwsh
        run: |
          $source = "build/windows64/Minecraft.Client/Release"
          $stage = "staging/neoLegacy"
          if (-not (Test-Path "$source/Minecraft.Client.exe")) {
            throw "Client executable was not produced."
          }
          New-Item -ItemType Directory -Force $stage | Out-Null
          Get-ChildItem $source -File | Where-Object {
            $_.Extension -in ".exe", ".dll"
          } | Copy-Item -Destination $stage
          foreach ($folder in @("Common", "music", "Windows64", "Windows64Media")) {
            if (Test-Path "$source/$folder") {
              Copy-Item "$source/$folder" "$stage/$folder" -Recurse
            }
          }
          foreach ($path in @("Common/Media", "Common/res", "iggy_w64.dll")) {
            if (-not (Test-Path "$stage/$path")) {
              throw "Runtime package is incomplete: $path"
            }
          }
          New-Item -ItemType Directory -Force "$stage/Windows64/GameHDD" | Out-Null
          Copy-Item STEAM_PROTON.md "$stage/STEAM_PROTON.md"
          Copy-Item BASE_STABILITY_TESTS.md "$stage/BASE_STABILITY_TESTS.md"
          Copy-Item END_UPDATE_TESTS.md "$stage/END_UPDATE_TESTS.md"
          Copy-Item FLIGHT_INVENTORY_TESTS.md "$stage/FLIGHT_INVENTORY_TESTS.md"
          Copy-Item PORTAL_RENDER_TESTS.md "$stage/PORTAL_RENDER_TESTS.md"
          Copy-Item CHORUS_TESTS.md "$stage/CHORUS_TESTS.md"
          Copy-Item OUTER_END_TESTS.md "$stage/OUTER_END_TESTS.md"
          Copy-Item GATEWAY_TESTS.md "$stage/GATEWAY_TESTS.md"
          Copy-Item END_CITY_TESTS.md "$stage/END_CITY_TESTS.md"
          Copy-Item SHULKER_BOX_TESTS.md "$stage/SHULKER_BOX_TESTS.md"
          Copy-Item MENDING_TESTS.md "$stage/MENDING_TESTS.md"
          Copy-Item FROST_WALKER_TESTS.md "$stage/FROST_WALKER_TESTS.md"
          Copy-Item CONTENT_UPDATE_TESTS.md "$stage/CONTENT_UPDATE_TESTS.md"
          Copy-Item OVERWORLD_TESTS.md "$stage/OVERWORLD_TESTS.md"
          Copy-Item END_RESPAWN_TESTS.md "$stage/END_RESPAWN_TESTS.md"
          Copy-Item INVENTORY_EQUIP_FIX_TESTS.md "$stage/INVENTORY_EQUIP_FIX_TESTS.md"
          Copy-Item MINI_GAME_TESTS.md "$stage/MINI_GAME_TESTS.md"
          Copy-Item TUTORIAL_WORLD_TESTS.md "$stage/TUTORIAL_WORLD_TESTS.md"
          Copy-Item END_RELIABILITY_TESTS.md "$stage/END_RELIABILITY_TESTS.md"
          Copy-Item MAP_TEXTURE_TESTS.md "$stage/MAP_TEXTURE_TESTS.md"
          Copy-Item VILLAGER_FOOD_TESTS.md "$stage/VILLAGER_FOOD_TESTS.md"
          Copy-Item SHULKER_LID_TESTS.md "$stage/SHULKER_LID_TESTS.md"
          Copy-Item WORLD_LAUNCH_FIX_TESTS.md "$stage/WORLD_LAUNCH_FIX_TESTS.md"
          Copy-Item SKIN_LAYOUT_TESTS.md "$stage/SKIN_LAYOUT_TESTS.md"
          Copy-Item ROCKET_COLOR_OBSERVER_TESTS.md "$stage/ROCKET_COLOR_OBSERVER_TESTS.md"
          Copy-Item END_FIGHT_AUDIT.md "$stage/END_FIGHT_AUDIT.md"
          @(
            "Commit: ${{ github.sha }}",
            "Configuration: Windows64 Release",
            "Runtime: Windows executable; test through Steam/Proton on Bazzite.",
            "Candidate: first Tumble mode, lobby import compatibility and endpoint join codes; includes all previous features and fixes.",
            "Compilation does not establish controller compatibility or CU59 parity."
          ) | Set-Content "$stage/BUILD_INFO.txt"
          Get-ChildItem $stage -Recurse -File |
            ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath((Resolve-Path $stage).Path, $_.Path)
              "$($_.Hash)  $relative"
            } | Set-Content staging/SHA256SUMS.txt

      - name: Upload client test artifact
        uses: actions/upload-artifact@v6
        with:
          name: neoLegacy-skin-layout-fix-windows64
          path: staging/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: steam-proton-build-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 14




